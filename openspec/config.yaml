schema: spec-driven

context: |
  This repository implements a portable external-mobile telemetry proof of
  concept. A TypeScript simulator sends operational telemetry through a
  controlled OpenTelemetry Collector and governed business events through an
  APIM-compatible gateway and backend to Azure Monitor Logs Ingestion.
  The supported development runtime is Node.js 22 through 25. Local execution
  uses Docker Compose and an explicit file ingestion adapter. Azure deployment
  uses Bicep and existing approved APIM and Log Analytics resources.
  Run npm ci, npm run build, npm run lint, npm test, npm run scan:secrets, and
  npm run infra:validate for implementation validation.
  Never embed Azure credentials in the simulator, silently fall back from Azure
  to local ingestion, permit arbitrary business-event properties, or delete
  shared APIM and Log Analytics resources.
  GitHub issues capture problems and ownership. OpenSpec specifications are the
  source of truth for accepted behavior. Pull requests must link both the issue
  and the OpenSpec change.

rules:
  proposal:
    - Include the related GitHub issue when one exists
    - State user impact, scope, and explicit non-goals
    - Identify compatibility, migration, security, and operational impact
  specs:
    - Express observable behavior with testable scenarios
    - Cover important failure and edge cases
  design:
    - Document meaningful alternatives and tradeoffs
    - Identify rollout, rollback, telemetry, and data migration needs when relevant
  tasks:
    - Keep tasks ordered, independently verifiable, and small enough to review
    - Include tests, documentation, and operational work required by the change

operations:
  apply:
    guidance:
      - Keep tasks.md aligned with actual implementation progress
      - Validate the acceptance scenarios and report commands actually run
  archive:
    guidance:
      - Archive only after the implementation and resulting specifications are accepted
