extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  attributes/sanitize:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: enduser.id
        action: delete
  batch:
    timeout: 1s
    send_batch_size: 64
    send_batch_max_size: 128

exporters:
  debug:
    verbosity: basic
  file:
    path: /data/traces.json
    rotation:
      max_megabytes: 10
      max_days: 1
      max_backups: 1

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/sanitize, batch]
      exporters: [debug, file]
